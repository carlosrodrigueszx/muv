name: CI - MUV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front-end (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node 24 e cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do lockfile
        run: npm ci

      - name: Auditar todas as dependencias
        run: npm audit

      - name: Executar ESLint
        run: npm run lint

      - name: Validar TypeScript e gerar build Vite
        run: npm run build

  backend:
    name: Back-end (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Confirmar versoes Java e Maven
        run: |
          java -version
          ./mvnw -version

      - name: Compilar, testar e verificar
        run: ./mvnw -B -ntp verify

      - name: Publicar relatorios Surefire
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
